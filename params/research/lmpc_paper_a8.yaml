sources:
  paper: Equations 5-17; N=12, K=20, P=80, Q=diag(.1,1,1,0,0,0), h=10, Epanechnikov,
    five-coefficient WLS, six-state nominal ATV and shifted terminal successor. State
    X applies at x0..xN-1; terminal uses the same lambda. A8 isolates removal of explicit
    steering FIFO; six-state prediction still does not encode finite steering-rate
    memory.
  adaptations: 'A8: original six-state paper model and command-steering five-column
    WLS; fresh three PP laps from no-delay plant in the same session. Current steering
    command replaces FIFO output in live plant, initialization replay and planning
    shadows. Original PID, steering rate limits, acceleration interface and vehicle
    integration retained. No seventh state, effective-input regression change, or
    A7 endpoint transition.'
  limits: Steering command at u0..u11 bounded by min(0.4189, 1.2 times maximum absolute
    historical command), scope local_80; symmetric envelope does not certify joint
    support. A4 bound vx[k+1] <= 1.2 times maximum vx in the 80 original WLS neighbors
    selected at nominal x[k], k=0..11; abs steering[k] <= 1.2 times maximum abs command
    in the same 80; acceleration remains +/-9.51; update only after successful history
    inclusion. Experiment speed cap8 uses an inscribed32-sided vx/vy polygon, at most0.4816percent
    radial conservatism. Forward vx>=0 is an experiment choice. Command steering +/-0.4189
    and acceleration +/-9.51 use simulator values; actual speed-dependent saturation,
    steering rate remains in plant; two-tick steering delay removed only for A8. Lateral
    .25m, heading .5rad and footprint .05m are ESP choices, not paper values. Legacy
    independent vy/r and progress boxes removed. Original-model checks protect the
    first applied action, not hypothetical future actions; candidate geometry checks
    retained. No global core permission changes.
  numerics: OSQP eps=1e-7, original residual gate1e-5 and rate weights[.5,.01] retained.
    Variable/row equilibration and numerical-nullspace hard-equality elimination are
    engineering solver operations. Literal finish h uses QP branches screened by conservative
    affine intervals, not one ordinary QP globally. Active-finish terminal costs are
    zero after finish; raw signed continuation potentials preserved. Boundary representation
    adjustments are within the original residual gate and dynamics are rechecked.
    No ridge, trust box, SQP, terminal slack or relaxed acceptance.

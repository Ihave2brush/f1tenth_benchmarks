sources:
  paper: Equations 5-17; N=12, K=20, P=80, Q=diag(.1,1,1,0,0,0), h=10, Epanechnikov,
    five-coefficient WLS, six-state nominal ATV and shifted terminal successor. State
    X applies at x0..xN-1; terminal uses the same lambda.
  adaptations: 'ESP/core Frenet observation and original Continuous plant retained.
    A2 PP reference is 2.5 m/s with seeded bounded delta/a excitation during the three
    PP laps only; a bounded interval acceleration adapter records genuine delta/a
    commands. SVD WLS rcond=1e-8, no ridge. Engineering initialization sets only unidentifiable
    vx acceleration gain to dt*cos(beta), beta=atan2(vy,vx), stationary beta=0; remaining
    coefficients refit conditionally. Identifiable gain uses unconstrained measured
    regression. First-ever horizon seeded from standing-start history; initial terminal
    candidate follows latest source lap as equation10. Source laps each include a
    genuinely observed consecutive continuation lap. Simulator acceleration uses existing
    per-substep PID inversion; actuator memory stays in plant only. A7 isolated experiment:
    seven-state QP, five-column mean-actual-steering WLS, six-state terminal. Nominal
    mean offsets anchored to exact discrete FIFO replay; slopes use continuous hold/slew
    approximation. Endpoint equals command is an approximation, not exact simulator
    dynamics.'
  limits: Steering command at u0..u11 bounded by min(0.4189, 1.2 times maximum absolute
    historical command), scope local_80; symmetric envelope does not certify joint
    support. A4 bound vx[k+1] <= 1.2 times maximum vx in the 80 original WLS neighbors
    selected at nominal x[k], k=0..11; abs steering[k] <= 1.2 times maximum abs command
    in the same 80; acceleration remains +/-9.51; update only after successful history
    inclusion. Experiment speed cap8 uses an inscribed32-sided vx/vy polygon, at most0.4816percent
    radial conservatism. Forward vx>=0 is an experiment choice. Command steering +/-0.4189
    and acceleration +/-9.51 use simulator values; actual speed-dependent saturation,
    steering rate and delay remain in plant. Lateral .25m, heading .5rad and footprint
    .05m are ESP choices, not paper values. Legacy independent vy/r and progress boxes
    removed. Original-model checks protect the first applied action, not hypothetical
    future actions; candidate geometry checks retained. No global core permission
    changes. Additional abs(delta_cmd - delta_act) <= .256 at all 12 stages; does
    not guarantee exact discrete endpoint tracking.
  numerics: OSQP eps=1e-7, original residual gate1e-5 and rate weights[.5,.01] retained.
    Variable/row equilibration and numerical-nullspace hard-equality elimination are
    engineering solver operations. Literal finish h uses QP branches screened by conservative
    affine intervals, not one ordinary QP globally. Active-finish terminal costs are
    zero after finish; raw signed continuation potentials preserved. Boundary representation
    adjustments are within the original residual gate and dynamics are rechecked.
    No ridge, trust box, SQP, terminal slack or relaxed acceptance.

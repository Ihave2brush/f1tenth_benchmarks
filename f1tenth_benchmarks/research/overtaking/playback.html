<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中線與候選回放</title>
<style>
:root{color-scheme:dark;--bg:#101a22;--panel:#17252f;--line:#304451;--text:#e6eff5;--muted:#a4b7c5;--accent:#64e0c1}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{flex:none;padding:17px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:21px;margin:0 0 5px}h2{font-size:14px;margin:20px 0 10px}p{line-height:1.6}small,.muted{color:var(--muted)}.badge{border:1px solid #3c746c;border-radius:20px;padding:7px 12px;color:var(--accent);white-space:nowrap}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;flex:1;min-height:280px;overflow:hidden}.map{position:relative;overflow:hidden;background:#192934}canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.tools{position:absolute;top:14px;left:14px;display:flex;flex-wrap:wrap;gap:8px;background:#101a22ed;border:1px solid var(--line);border-radius:8px;padding:9px}.legend{position:absolute;bottom:14px;left:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#101a22ed;line-height:1.7;font-size:12px}.legend span{margin-right:10px}.note{color:var(--muted);font-size:12px;line-height:1.6}aside{padding:16px 20px;overflow:auto;border-left:1px solid var(--line)}dl{display:grid;grid-template-columns:104px 1fr;gap:8px;font:12px ui-monospace,monospace}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.status{background:#223540;border-radius:6px;padding:10px;line-height:1.6}.candidate{border-top:1px solid var(--line);padding:9px 0;line-height:1.5;font-size:12px}.candidate strong{font-size:13px}.candidate .reason{color:#ffc18b;overflow-wrap:anywhere}.code{font:11px ui-monospace,monospace;overflow-wrap:anywhere;color:var(--muted)}footer{flex:none;border-top:1px solid var(--line);padding:13px 22px;background:var(--panel);min-height:152px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timeline{display:flex;align-items:center;gap:14px;margin:12px 0}.timeline input{flex:1;min-width:80px;accent-color:var(--accent)}button,select,input[type=number]{background:#213340;color:var(--text);border:1px solid #526b7b;border-radius:6px;padding:7px 10px;font:inherit}button{cursor:pointer}button:hover{background:#304957}button:disabled{opacity:.4;cursor:default}button.primary{background:#286b60;border-color:#4cb69f;min-width:83px}input[type=number]{width:105px}label{white-space:nowrap}.spacer{flex:1}#error{color:#ffc18b;min-height:19px;font-size:12px;margin-top:7px}#playbackStatus{font-size:13px;color:var(--accent)}details{margin-top:18px}summary{cursor:pointer;color:var(--muted)}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) minmax(140px,.6fr);min-height:380px}.map{min-height:0}aside{border-left:0;min-height:0}header{padding:14px}footer{padding:13px}.badge{font-size:11px}.tools{max-width:95%}}
</style>
<header><div><h1>中線與候選回放</h1><small id="sessionName">載入已保存的 session…</small><div id="generationProgress" class="note"></div></div><div class="badge">記錄回放 · 候選未接管控制</div></header>
<main>
<section class="map" aria-label="賽道回放畫面">
  <canvas id="canvas" aria-label="地圖、車輛與五條候選，可滾輪縮放與拖曳平移"></canvas>
  <div class="tools"><button id="fit">全圖</button><button id="focusCar">查看車輛</button><label><input type="checkbox" id="follow">跟隨車輛</label></div>
  <div class="legend"><div id="pathLegend"></div><div>白色車身：當前車況　白色虛線：候選來源車位</div><div>實線：中心點／折線取樣通過　虛線：拒絕</div><div class="muted">滾輪縮放 · 拖曳平移 · 只顯示截至游標的實際軌跡</div></div>
</section>
<aside>
  <div id="stateStatus" class="status" aria-live="polite">載入資料中…</div>
  <h2>車況</h2><dl id="stateValues"></dl>
  <h2>目前候選</h2><p id="planningSettings" class="note"></p><div id="planStatus" class="note">尚無候選</div><dl id="planValues"></dl>
  <div id="candidates"></div>
  <h2>圖層</h2><div class="row"><label><input id="center" type="checkbox" checked>中線</label><label><input id="bounds" type="checkbox" checked>邊界散點</label><label><input id="trail" type="checkbox" checked>實際軌跡</label><label><input id="paths" type="checkbox" checked>候選</label><label><input id="source" type="checkbox" checked>來源車位</label></div>
  <p class="note">候選固定在生成時的地圖座標，不隨車平移。取樣通過不代表完整車身或動態安全。</p>
  <details><summary>資料來源</summary><p id="version" class="code"></p><p id="indexStatus" class="note"></p></details>
</aside>
</main>
<footer>
  <div class="row"><button id="home" disabled>回到起點</button><button id="previous" disabled>上一步</button><button id="play" class="primary" disabled>播放</button><button id="next" disabled>下一步</button><label>倍速 <select id="rate" aria-label="播放倍速"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><span class="spacer"></span><span id="playbackStatus" role="status">準備回放</span></div>
  <div class="timeline"><span id="position">步號 — / —</span><input id="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="時間軸" disabled><span id="timeLabel">0.00 / 0.00 s</span></div>
  <div class="row"><label>步號 <input id="stepInput" type="number" min="0" step="1" value="0" aria-label="跳轉步號"></label><button id="jumpStep" disabled>跳到步號</button><label>相對時間 <input id="timeInput" type="number" min="0" step="0.1" value="0" aria-label="跳轉相對時間"></label><button id="jumpTime" disabled>跳到時間</button><small>前後單步與跳轉會暫停；時間跳轉取目標以前最近的實際樣本。</small></div>
  <div id="error" role="alert"></div>
</footer>
<script src="/playback.js"></script>
</html>
